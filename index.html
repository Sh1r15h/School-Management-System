<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS Management</title>
<style>
:root{--p:#7655e8;--lav:#eee9ff;--bg:#f7f7fb;--line:#e9e6f2;--ink:#29263d;--muted:#817e91}*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;overflow:auto;background:linear-gradient(#fbfaff,#eee9ff);border-right:1px solid #e4def7;padding:18px 12px}.brand{font-size:19px;font-weight:800;padding:8px 10px 20px}.brand span{color:var(--p)}.nav-group{margin-bottom:6px}.nav-parent,.nav-child,.logout{display:block;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer}.nav-parent{font-weight:700}.nav-child{padding:6px 8px 6px 34px;font-size:11px}.nav-parent:hover,.nav-child:hover,.nav-parent.active,.nav-child.active,.logout:hover{background:#dcd2ff;color:#5030bd}.ico{display:inline-block;width:23px;color:var(--p)}.main{margin-left:245px}.top{height:68px;position:sticky;top:0;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 25px}.search{padding:10px;border:1px solid var(--line);border-radius:8px;width:280px}.avatar{background:var(--lav);color:var(--p);padding:11px;border-radius:50%;font-weight:bold}.content{padding:26px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0;font-size:24px}.muted{color:var(--muted);font-size:12px}.btn{display:inline-block;border:0;border-radius:8px;background:var(--p);color:white;padding:9px 13px;cursor:pointer;font-weight:600}.btn.light{background:var(--lav);color:#5639be}.btn.danger{background:#ffeded;color:#c33d4d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.num{font-size:25px;font-weight:800;margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel h3{font-size:15px;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #f0eef5}th{color:#9692a5;text-transform:uppercase;font-size:10px}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}.toolbar{margin-bottom:14px}.toolbar input{padding:10px;border:1px solid var(--line);border-radius:8px;width:270px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:850px}.form label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.notice{padding:16px;background:#fbf9ff;border:1px dashed #d9d0f5;border-radius:9px}.pill{background:#e5f7ec;color:#27834a;padding:4px 8px;border-radius:20px;font-size:10px}.login{min-height:100vh;display:grid;place-items:center}.loginbox{width:min(370px,90vw);background:white;border:1px solid var(--line);padding:30px;border-radius:14px}.loginbox input{width:100%;padding:12px;margin:7px 0;border:1px solid var(--line);border-radius:8px}.loginbox button{width:100%;margin-top:8px}@media(max-width:850px){.sidebar{width:200px}.main{margin-left:200px}.cards{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:600px){.sidebar{position:relative;width:100%;max-height:340px}.main{margin-left:0}.content{padding:15px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.actions{grid-column:auto}.top{padding:0 12px}}
</style></head><body><div id="root"></div>
<script>
const seed={students:[{id:1,name:"Aarav Sharma",className:"10-A",phone:"9876543210",email:"aarav@gmail.com",status:"Active"}],employees:[{id:1,name:"Priya Nair",designation:"Teacher",department:"Science",phone:"9876500002",status:"Active"}],classes:[{id:1,name:"10-A",section:"A",teacher:"Priya Nair",room:"201",students:32}],subjects:[{id:1,name:"Mathematics",code:"MATH101",className:"10-A",teacher:"Priya Nair"}],fees:[{id:1,student:"Aarav Sharma",className:"10-A",type:"Tuition Fee",amount:25000,status:"Paid",date:"2026-08-20"}],books:[{id:1,title:"Computer Fundamentals",author:"P. K. Sinha",category:"Computer",qty:8,available:6}],expenses:[{id:1,title:"Electricity Bill",category:"Utilities",amount:18500,date:"2026-08-10"}],exams:[{id:1,name:"Mid Term Examination",className:"10-A",subject:"Mathematics",date:"2026-09-10",status:"Scheduled"}]};
let db;try{db=JSON.parse(localStorage.getItem("smsnav_db"))||JSON.parse(JSON.stringify(seed))}catch(e){db=JSON.parse(JSON.stringify(seed))}
const save=()=>localStorage.setItem("smsnav_db",JSON.stringify(db));
let page="dashboard";
const groups=[
["dashboard","▦","Dashboard",[]],
["class","♢","Class",[["classes","▤","View All Class"],["class-add","▣","Add New Class"]]],
["subject","♢","Subject",[["subject-all","▤","All Class & Subjects"],["subject-assign","▣","Add & Assign Subjects"]]],
["students","♙","Students",[["student-add","▤","Student Admission"],["student-list","▣","All student List"]]],
["employee","♟","Employee",[["employee-add","▤","Add Employee"],["employee-list","▣","View All Employee"],["job-letter","▤","Job Letter"]]],
["attendance","✓","Attendance",[["employee-attendance","▤","Employee Attendance"],["student-attendance","▣","Student Attendance"]]],
["fees-collection","₹","Fees Collection",[["fee-structure","♧","Fees Structure"],["student-fees","♧","View Student Fees Details"],["fees-report","▥","Fees Collection Report"]]],
["academics","▣","Academics",[["create-subject","▤","Create Subject"],["assign-subject","▤","Assign Subject"]]],
["timetable","▦","Time Table",[["time-slots","◉","Create Time Slots"],["create-timetable","▣","Create Time Table"],["view-timetable","▣","View Time Table"]]]
];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fields={students:[["name","Student Name"],["className","Class"],["phone","Phone"],["email","Email"],["status","Status"]],employees:[["name","Employee Name"],["designation","Designation"],["department","Department"],["phone","Phone"],["status","Status"]],classes:[["name","Class"],["section","Section"],["teacher","Teacher"],["room","Room"],["students","Student Count"]],subjects:[["name","Subject"],["code","Subject Code"],["className","Class"],["teacher","Teacher"]],fees:[["student","Student"],["className","Class"],["type","Fee Type"],["amount","Amount"],["status","Status"],["date","Date"]],books:[["title","Book"],["author","Author"],["category","Category"],["qty","Quantity"],["available","Available"]],expenses:[["title","Expense"],["category","Category"],["amount","Amount"],["date","Date"]],exams:[["name","Exam"],["className","Class"],["subject","Subject"],["date","Date"],["status","Status"]]};
function heading(t,sub,action=""){return `<div class="head"><div><h1>${t}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function nav(){return groups.map(g=>`<div class="nav-group"><a class="nav-parent ${page===g[0]||g[3].some(x=>x[0]===page)?"active":""}" href="#${g[0]}"><span class="ico">${g[1]}</span>${g[2]}</a>${g[3].map(x=>`<a class="nav-child ${page===x[0]?"active":""}" href="#${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</a>`).join("")}</div>`).join("")+`<a class="logout" href="#logout">⇥ Logout</a>`}
function shell(body){return `<aside class="sidebar"><div class="brand">SMS <span>MANAGEMENT</span></div><nav>${nav()}</nav></aside><main class="main"><header class="top"><input class="search" id="searchAll" placeholder="Search this page..."><div><b>Admin</b>　<span class="avatar">AD</span></div></header><section class="content">${body}</section></main>`}
function table(type,title,sub,cols){let rows=db[type]||[];return heading(title,sub,`<a class="btn" href="#add-${type}">+ Add New</a>`)+`<div class="toolbar"><input data-filter placeholder="Search ${title.toLowerCase()}..."></div><div class="panel tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join("")}<td><button class="btn light" data-edit="${type}:${r.id}">Edit</button> <button class="btn danger" data-delete="${type}:${r.id}">Delete</button></td></tr>`).join("")||`<tr><td colspan="${cols.length+1}">No records</td></tr>`}</tbody></table></div>`}
function form(type,id=null,back=null){let old=id?db[type].find(x=>x.id===id)||{}:{};return heading(id?"Edit Record":"Add "+type.slice(0,-1),"Enter record details")+`<div class="panel"><form class="form" data-form="${type}" data-id="${id||""}" data-back="${back||type}">${(fields[type]||[]).map(([k,l])=>`<div><label>${l}</label><input name="${k}" value="${esc(old[k]||"")}" required></div>`).join("")}<div class="actions"><a class="btn light" href="#${back||type}">Cancel</a><button class="btn">Save Record</button></div></form></div>`}
function simple(t,sub,labels=[]){return heading(t,sub)+`<div class="panel"><form class="form" data-simple>${labels.map(l=>`<div><label>${l}</label><input required placeholder="${l}"></div>`).join("")}<div class="actions"><button class="btn">Save</button></div></form></div>`}
function dashboard(){return heading("Dashboard","Welcome back, Admin")+`<div class="cards">${[["Total Students",db.students.length],["Employees",db.employees.length],["Classes",db.classes.length],["Fee Collection","₹"+db.fees.reduce((a,x)=>a+Number(x.amount||0),0).toLocaleString("en-IN")]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div><div class="cols"><div class="panel"><h3>Quick links</h3><p><a class="btn light" href="#student-list">Students</a> <a class="btn light" href="#classes">Classes</a> <a class="btn light" href="#fees-report">Fees</a></p></div><div class="panel"><h3>Recent Students</h3>${db.students.map(x=>`<p>${esc(x.name)} — ${esc(x.className)}</p>`).join("")}</div></div>`}
function attendance(kind){let arr=kind==="student"?"students":"employees";return heading(kind==="student"?"Student Attendance":"Employee Attendance","Mark attendance")+`<div class="panel"><table><thead><tr><th>Name</th><th>Class / Department</th><th>Status</th></tr></thead><tbody>${db[arr].map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.className||x.department||"")}</td><td><select><option>Present</option><option>Absent</option><option>Late</option></select></td></tr>`).join("")}</tbody></table><button class="btn" onclick="alert('Attendance marked for this session')">Save Attendance</button></div>`}
function route(){
 let r=(location.hash||"#dashboard").slice(1);
 if(r==="logout"){localStorage.removeItem("smsnav_logged");login();return}
 let body;
 if(r==="dashboard")body=dashboard();
 else if(r==="class")body=heading("Class","Manage classes")+`<div class="notice">Choose a class submenu item from the sidebar.</div>`;
 else if(r==="classes")body=table("classes","View All Class","Manage classes",fields.classes);
 else if(r==="class-add"||r==="add-classes")body=form("classes",null,"classes");
 else if(r==="subject")body=heading("Subject","Manage subjects")+`<div class="notice">Choose All Class & Subjects or Add & Assign Subjects.</div>`;
 else if(r==="subject-all"||r==="subjects")body=table("subjects","All Class & Subjects","Subject list",fields.subjects);
 else if(r==="subject-assign"||r==="create-subject"||r==="assign-subject"||r==="add-subjects")body=form("subjects",null,"subject-all");
 else if(r==="students")body=heading("Students","Manage students")+`<div class="notice">Choose Student Admission or All student List.</div>`;
 else if(r==="student-add"||r==="add-students")body=form("students",null,"student-list");
 else if(r==="student-list")body=table("students","All student List","Manage student records",fields.students);
 else if(r==="employee")body=heading("Employee","Manage employees")+`<div class="notice">Choose Add Employee or View All Employee.</div>`;
 else if(r==="employee-add"||r==="add-employees")body=form("employees",null,"employee-list");
 else if(r==="employee-list")body=table("employees","View All Employee","Manage staff",fields.employees);
 else if(r==="job-letter")body=simple("Job Letter","Prepare employee job letter",["Employee Name","Designation","Joining Date"]);
 else if(r==="attendance")body=heading("Attendance","Select register")+`<div class="cards"><a class="card" href="#student-attendance">Student Attendance →</a><a class="card" href="#employee-attendance">Employee Attendance →</a></div>`;
 else if(r==="student-attendance")body=attendance("student");
 else if(r==="employee-attendance")body=attendance("employee");
 else if(r==="fees-collection")body=heading("Fees Collection","Manage fees")+`<div class="notice">Choose a fee submenu item.</div>`;
 else if(r==="fee-structure")body=simple("Fees Structure","Configure fees",["Fee Name","Class","Amount"]);
 else if(r==="student-fees"||r==="fees-report")body=table("fees",r==="student-fees"?"View Student Fees Details":"Fees Collection Report","Fee records",fields.fees);
 else if(r==="academics")body=heading("Academics","Manage subjects")+`<div class="cards"><a class="card" href="#create-subject">Create Subject →</a><a class="card" href="#assign-subject">Assign Subject →</a></div>`;
 else if(r==="timetable")body=heading("Time Table","Manage timetable")+`<div class="cards"><a class="card" href="#time-slots">Create Time Slots →</a><a class="card" href="#create-timetable">Create Time Table →</a><a class="card" href="#view-timetable">View Time Table →</a></div>`;
 else if(r==="time-slots")body=simple("Create Time Slots","Configure periods",["Slot Name","Start Time","End Time"]);
 else if(r==="create-timetable")body=simple("Create Time Table","Schedule class periods",["Class","Day","Subject","Time Slot"]);
 else if(r==="view-timetable")body=heading("View Time Table","Scheduled periods")+`<div class="notice">No timetable entries yet. Use Create Time Table to add one.</div>`;
 else if(r==="library")body=table("books","Library","Manage books",fields.books);
 else if(r==="expenses")body=table("expenses","Expenses","Manage expenses",fields.expenses);
 else if(r==="exams")body=table("exams","Examination","Manage exams",fields.exams);
 else if(r.startsWith("add-"))body=form(r.slice(4),null,r.slice(4));
 else if(r.includes("-edit-")){let [type,id]=r.split("-edit-");body=form(type,Number(id),type)}
 else body=heading("Page not found","Choose a section from the navigation");
 document.getElementById("root").innerHTML=shell(body);
}
function login(){document.getElementById("root").innerHTML=`<div class="login"><div class="loginbox"><h2 style="text-align:center">SMS Management</h2><p class="muted" style="text-align:center">School Management System</p><form id="login"><input name="u" value="admin" placeholder="Username"><input name="p" value="admin123" type="password" placeholder="Password"><button class="btn">Login</button><p class="muted">Demo: admin / admin123</p></form></div></div>`}
document.addEventListener("click",e=>{
 let b=e.target.closest("[data-delete]");if(b){let [t,id]=b.dataset.delete.split(":");if(confirm("Delete this record?")){db[t]=db[t].filter(x=>x.id!==Number(id));save();route()}return}
 b=e.target.closest("[data-edit]");if(b){let [t,id]=b.dataset.edit.split(":");location.hash=t+"-edit-"+id;return}
});
document.addEventListener("submit",e=>{
 if(e.target.id==="login"){e.preventDefault();let d=new FormData(e.target);if(d.get("u")==="admin"&&d.get("p")==="admin123"){localStorage.setItem("smsnav_logged","1");if(!location.hash)location.hash="#dashboard";route()}else alert("Invalid login");return}
 if(e.target.matches("[data-form]")){e.preventDefault();let f=e.target,t=f.dataset.form,id=Number(f.dataset.id)||null,o={};new FormData(f).forEach((v,k)=>o[k]=v);if(["amount","qty","available","students"].some(k=>k in o))for(let k of ["amount","qty","available","students"])if(k in o)o[k]=Number(o[k]);if(id){let i=db[t].findIndex(x=>x.id===id);if(i>=0)db[t][i]={...db[t][i],...o}}else{o.id=Date.now();db[t].push(o)}save();location.hash="#"+f.dataset.back;route();return}
 if(e.target.matches("[data-simple]")){e.preventDefault();alert("Form submitted. This screen is a UI prototype; connect a backend to persist this module.");e.target.reset()}
});
window.addEventListener("hashchange",()=>{if(localStorage.getItem("smsnav_logged")==="1")route()});
document.addEventListener("input",e=>{if(e.target.matches("[data-filter]")){let q=e.target.value.toLowerCase();e.target.closest(".content").querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}});
if(localStorage.getItem("smsnav_logged")==="1"){if(!location.hash)location.hash="#dashboard";route()}else login();
</script></body></html>
